<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chuyển Đổi Ảnh Về Văn Bản Và Ngược Lại</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
.section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
h2 { margin-top: 0; }
textarea { width: 100%; height: 100px; margin-top: 10px; }
img { max-width: 100%; height: auto; margin-top: 10px; border: 1px solid #ddd; }
.controls { margin-top: 10px; }
</style>
</head>
<body>

<h1>Công Cụ Chuyển Đổi Ảnh <-> Văn Bản</h1>

<div class="section">
<h2>1. Chuyển Ảnh Sang Văn Bản (.txt)</h2>
<input type="file" id="imageInput" accept="image/*">
<br>
<textarea id="base64Output" placeholder="Mã văn bản (Base64) sẽ xuất hiện ở đây..." readonly></textarea>
<br>
<button onclick="downloadTxt()">Lưu Thành File TXT</button>
</div>

<div class="section">
<h2>2. Chuyển Văn Bản Sang Ảnh (Có Điều Chỉnh Độ Phân Giải)</h2>
<label>Chọn file TXT:</label>
<input type="file" id="txtFileInput" accept=".txt">
<p>Hoặc dán mã Base64 vào đây:</p>
<textarea id="base64Input" placeholder="Dán mã văn bản Base64 tại đây..."></textarea>

<div class="controls">
<label>Chiều rộng (px): </label>
<input type="number" id="imgWidth" placeholder="Mặc định">
<label>Chiều cao (px): </label>
<input type="number" id="imgHeight" placeholder="Mặc định">
<button onclick="renderImage()">Chuyển Thành Ảnh</button>
</div>

<div id="imageResultControls" style="display:none; margin-top: 10px;">
<button onclick="downloadImage()">Tải Ảnh Về</button>
</div>
<br>
<canvas id="canvas" style="display:none;"></canvas>
<img id="outputImage" alt="Kết quả hình ảnh sẽ hiển thị ở đây">
</div>

<script>
function imageToBase64(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) { callback(e.target.result); };
  reader.readAsDataURL(file);
}

document.getElementById('imageInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    imageToBase64(file, function(base64Str) {
      document.getElementById('base64Output').value = base64Str;
    });
  }
});

function downloadTxt() {
  const text = document.getElementById('base64Output').value;
  if (!text) { alert('Vui lòng chọn ảnh trước!'); return; }
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hinhanh_machoah.txt';
  a.click();
}

document.getElementById('txtFileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      document.getElementById('base64Input').value = evt.target.result;
    };
    reader.readAsText(file);
  }
});

function renderImage() {
  const base64Str = document.getElementById('base64Input').value.trim();
  if (!base64Str) { alert('Vui lòng nhập văn bản mã hóa hoặc tải file txt lên!'); return; }

  const img = new Image();
  img.onload = function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = parseInt(document.getElementById('imgWidth').value) || img.width;
    let height = parseInt(document.getElementById('imgHeight').value) || img.height;

    canvas.width = width;
    canvas.height = height;

    ctx.drawImage(img, 0, 0, width, height);

    const resizedDataUrl = canvas.toDataURL('image/png');
    const outputImg = document.getElementById('outputImage');
    outputImg.src = resizedDataUrl;
    document.getElementById('imageResultControls').style.display = 'block';
  };
  img.src = base64Str;
}

function downloadImage() {
  const outputImg = document.getElementById('outputImage');
  if (!outputImg.src) return;
  const a = document.createElement('a');
  a.href = outputImg.src;
  a.download = 'ketqua_hinhanh.png';
  a.click();
}
</script>

</body>
</html>
