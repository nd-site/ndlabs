<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ND Labs</title>

    <meta
        name="description"
        content="Các dự án, sản phẩm và công cụ của ND Labs."
    >

    <link
        rel="icon"
        href="https://ndsite.web.app/assets/images/logo.png"
    >

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #0075f1;
            --text: #12304a;
            --muted: #668096;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: "Play", sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0, 117, 241, 0.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(90, 190, 255, 0.14),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f7fcff 0%,
                    #eef8ff 50%,
                    #f8fcff 100%
                );

            background-attachment: fixed;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: min(1100px, calc(100% - 28px));
            margin: 0 auto;

            padding: 35px 0 50px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            margin-bottom: 35px;
        }

        .logo {
            width: 86px;
            height: 86px;

            object-fit: contain;

            margin-bottom: 14px;

            filter:
                drop-shadow(
                    0 10px 20px rgba(0, 117, 241, 0.15)
                );
        }

        .brand {
            color: var(--blue);

            font-size:
                clamp(2rem, 5vw, 3rem);

            line-height: 1;

            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            max-width: 650px;

            margin-top: 10px;

            color: var(--muted);

            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* =========================
           LINKS
        ========================= */

        .links-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 17px;
        }

        .link-card {
            position: relative;

            display: flex;
            align-items: center;

            gap: 16px;

            min-height: 116px;

            padding: 19px;

            border-radius: 21px;

            border: 1px solid
                rgba(0, 117, 241, 0.11);

            background:
                var(
                    --card-color,
                    #ffffff
                );

            box-shadow:
                0 8px 28px
                rgba(0, 70, 130, 0.07);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .link-card:hover {
            transform: translateY(-4px);

            border-color:
                rgba(0, 117, 241, 0.23);

            box-shadow:
                0 15px 35px
                rgba(0, 70, 130, 0.12);
        }

        .link-card:active {
            transform: scale(0.985);
        }

        /* =========================
           IMAGE
        ========================= */

        .card-image {
            flex: 0 0 auto;

            width: 65px;
            height: 65px;

            object-fit: cover;

            border-radius: 17px;

            background: #edf7ff;

            border: 1px solid
                rgba(0, 117, 241, 0.08);
        }

        /* =========================
           ICON
        ========================= */

        .card-icon {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 65px;
            height: 65px;

            border-radius: 17px;

            background:
                var(
                    --icon-color,
                    #0075f1
                );

            color:
                var(
                    --icon-text-color,
                    #ffffff
                );

            font-size: 1.25rem;

            font-weight: 700;

            box-shadow:
                0 5px 14px
                rgba(0, 80, 160, 0.12);
        }

        /* =========================
           CONTENT
        ========================= */

        .card-content {
            min-width: 0;
            flex: 1;
        }

        .card-title {
            color:
                var(
                    --title-color,
                    #12304a
                );

            font-size: 1.22rem;

            font-weight: 700;

            line-height: 1.25;
        }

        .card-description {
            margin-top: 6px;

            color:
                var(
                    --description-color,
                    #668096
                );

            font-size: 0.94rem;

            line-height: 1.45;

            display: -webkit-box;

            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;

            overflow: hidden;
        }

        /* =========================
           ARROW
        ========================= */

        .arrow {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background:
                color-mix(
                    in srgb,
                    var(--icon-color, #0075f1)
                    10%,
                    transparent
                );

            color:
                var(
                    --icon-color,
                    #0075f1
                );

            font-size: 1.35rem;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .link-card:hover .arrow {
            background:
                var(
                    --icon-color,
                    #0075f1
                );

            color: white;

            transform: translateX(3px);
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            grid-column: 1 / -1;

            padding: 45px 20px;

            text-align: center;

            border-radius: 22px;

            border: 1px dashed
                rgba(0, 117, 241, 0.25);

            background:
                rgba(255, 255, 255, 0.65);
        }

        .empty h2 {
            color: var(--blue);

            margin-bottom: 8px;
        }

        .empty p {
            color: var(--muted);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 40px;

            text-align: center;

            color: #8197aa;

            font-size: 0.9rem;
        }

        footer strong {
            color: var(--blue);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 720px) {

            .page {
                width:
                    min(
                        100% - 18px,
                        600px
                    );

                padding-top: 25px;
            }

            .links-grid {
                grid-template-columns: 1fr;

                gap: 13px;
            }

            .link-card {
                min-height: 100px;

                padding: 15px;

                border-radius: 18px;
            }

            .card-image,
            .card-icon {
                width: 55px;
                height: 55px;

                border-radius: 14px;
            }

            .card-title {
                font-size: 1.1rem;
            }

            .card-description {
                font-size: 0.89rem;
            }

            .arrow {
                width: 34px;
                height: 34px;
            }
        }

        @media (max-width: 390px) {

            .link-card {
                gap: 10px;
            }

            .card-image,
            .card-icon {
                width: 50px;
                height: 50px;
            }

            .card-title {
                font-size: 1rem;
            }

            .card-description {
                font-size: 0.84rem;
            }
        }
    </style>
</head>

<body>

<main class="page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <img
            class="logo"
            src="https://ndsite.web.app/assets/images/logo.png"
            alt="ND Labs"
        >

        <h1 class="brand">
            ND Labs
        </h1>

        <p class="subtitle">
            Khám phá các dự án, công cụ và sản phẩm
            được phát triển bởi ND Labs.
        </p>

    </header>


    <!-- =========================
         LINKS
    ========================== -->

    <section
        id="linksContainer"
        class="links-grid"
        aria-label="Các liên kết"
    ></section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>
        © <span id="year"></span>
        <strong>ND Labs</strong>
    </footer>

</main>


<!-- DATA -->

<script src="links.js"></script>


<script>

    const container =
        document.getElementById(
            "linksContainer"
        );


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

        if (
            value === undefined ||
            value === null
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       RENDER
    ========================= */

    function renderLinks() {

        if (
            !Array.isArray(ndLinks) ||
            ndLinks.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        Chưa có liên kết
                    </h2>

                    <p>
                        Hãy thêm dữ liệu vào
                        <strong>links.js</strong>.
                    </p>

                </div>

            `;

            return;
        }


        container.innerHTML =
            ndLinks.map(
                item => {

                    const title =
                        escapeHTML(
                            item.title ||
                            "Không có tiêu đề"
                        );

                    const description =
                        escapeHTML(
                            item.description ||
                            ""
                        );

                    const url =
                        escapeHTML(
                            item.url ||
                            "#"
                        );


                    const cardColor =
                        escapeHTML(
                            item.color ||
                            "#ffffff"
                        );

                    const titleColor =
                        escapeHTML(
                            item.textColor ||
                            "#12304a"
                        );

                    const descriptionColor =
                        escapeHTML(
                            item.mutedColor ||
                            "#668096"
                        );

                    const iconColor =
                        escapeHTML(
                            item.iconColor ||
                            "#0075f1"
                        );

                    const iconTextColor =
                        escapeHTML(
                            item.iconTextColor ||
                            "#ffffff"
                        );


                    /* =====================
                       MEDIA
                    ===================== */

                    let media;


                    if (item.image) {

                        media = `

                            <img
                                class="card-image"
                                src="${escapeHTML(
                                    item.image
                                )}"
                                alt="${title}"
                                loading="lazy"
                                onerror="
                                    this.style.display='none';
                                    this.nextElementSibling.style.display='flex';
                                "
                            >

                            <div
                                class="card-icon"
                                style="
                                    --icon-color:${iconColor};
                                    --icon-text-color:${iconTextColor};
                                    display:none;
                                "
                            >
                                ${escapeHTML(
                                    item.icon ||
                                    "ND"
                                )}
                            </div>

                        `;

                    } else {

                        media = `

                            <div
                                class="card-icon"
                                style="
                                    --icon-color:${iconColor};
                                    --icon-text-color:${iconTextColor};
                                "
                            >
                                ${escapeHTML(
                                    item.icon ||
                                    "ND"
                                )}
                            </div>

                        `;

                    }


                    /* =====================
                       TARGET
                    ===================== */

                    const target =
                        item.newTab === false
                            ? ""
                            : `
                                target="_blank"
                                rel="noopener noreferrer"
                              `;


                    return `

                        <a
                            class="link-card"

                            href="${url}"

                            style="
                                --card-color:${cardColor};
                                --title-color:${titleColor};
                                --description-color:${descriptionColor};
                                --icon-color:${iconColor};
                            "

                            ${target}
                        >

                            ${media}


                            <div class="card-content">

                                <div class="card-title">
                                    ${title}
                                </div>


                                ${
                                    description
                                        ? `
                                            <div
                                                class="
                                                    card-description
                                                "
                                            >
                                                ${description}
                                            </div>
                                          `
                                        : ""
                                }

                            </div>


                            <div class="arrow">
                                ›
                            </div>

                        </a>

                    `;

                }
            )
            .join("");

    }


    /* =========================
       YEAR
    ========================= */

    document.getElementById(
        "year"
    ).textContent =
        new Date().getFullYear();


    /* =========================
       START
    ========================= */

    renderLinks();

</script>

</body>
</html>
