                                <span class="bg-book-primary text-white w-8 h-8 flex items-center justify-center rounded-lg text-sm">IV</span> 
                                CHỦ NGHĨA TƯ BẢN HIỆN ĐẠI (TỪ 1945 ĐẾN NAY)
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                    <strong class="text-emerald-800 block mb-2"><i class="fas fa-rocket mr-2"></i> Tiềm năng & Ưu thế:</strong>
                                    <ul class="list-disc pl-5 text-sm space-y-1">
                                        <li>Trình độ sản xuất rất cao dựa trên CM Khoa học - Công nghệ.</li>
                                        <li>Khả năng tự điều chỉnh và thích nghi với biến động kinh tế.</li>
                                        <li>Mở rộng liên kết khu vực và toàn cầu hóa kinh tế.</li>
                                    </ul>
                                </div>
                                <div class="bg-red-50 p-4 rounded-xl border border-red-100">
                                    <strong class="text-red-800 block mb-2"><i class="fas fa-exclamation-triangle mr-2"></i> Thách thức & Hạn chế:</strong>
                                    <ul class="list-disc pl-5 text-sm space-y-1">
                                        <li>Gia tăng khoảng cách giàu nghèo và bất bình đẳng xã hội.</li>
                                        <li>Đối mặt với các đợt khủng hoảng tài chính - kinh tế chu kỳ.</li>
                                        <li>Mâu thuẫn xã hội cùng các rủi ro cạn kiệt tài nguyên & môi trường.</li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <!-- V. Mốc thời gian -->
                        <section>
                            <h3 class="font-heading text-2xl font-bold text-book-primary flex items-center gap-2 mb-4 border-b border-gray-100 pb-2">
                                <span class="bg-book-primary text-white w-8 h-8 flex items-center justify-center rounded-lg text-sm">V</span> 
                                CÁC MỐC THỜI GIAN TRỌNG TÂM
                            </h3>
                            <div class="overflow-x-auto rounded-xl border border-gray-200">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-book-primary-light text-book-text font-heading uppercase text-xs">
                                        <tr>
                                            <th class="px-4 py-3 font-bold border-b border-gray-200 w-1/3">Mốc thời gian</th>
                                            <th class="px-4 py-3 font-bold border-b border-gray-200 w-2/3">Nội dung chuyển biến</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-200 bg-white">
                                        <tr>
                                            <td class="px-4 py-3 font-semibold text-book-primary">XVI - XVIII</td>
                                            <td class="px-4 py-3">CNTB từng bước hình thành và xác lập ở châu Âu & Bắc Mỹ.</td>
                                        </tr>
                                        <tr>
                                            <td class="px-4 py-3 font-semibold text-book-primary">Nửa sau XIX</td>
                                            <td class="px-4 py-3">CNTB thắng lợi hoàn toàn trên phạm vi thế giới.</td>
                                        </tr>
                                        <tr>
                                            <td class="px-4 py-3 font-semibold text-book-primary">Cuối XIX - đầu XX</td>
                                            <td class="px-4 py-3">CNTB chuyển sang giai đoạn độc quyền (Chủ nghĩa đế quốc).</td>
                                        </tr>
                                        <tr>
                                            <td class="px-4 py-3 font-semibold text-book-primary">Từ 1945 đến nay</td>
                                            <td class="px-4 py-3">CNTB bước vào giai đoạn CNTB hiện đại.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                `
            }
        ];

        let currentIndex = 0;
        const tocContainer = document.getElementById('toc-container');
        const contentDisplay = document.getElementById('content-display');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const sidebar = document.getElementById('sidebar');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        let mobileMenuOpen = false;

        function buildNavigation() {
            tocContainer.innerHTML = '';
            bookData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-item w-full text-left p-4 rounded-2xl transition-all flex items-center gap-3 hover:bg-book-primary-light/50 border border-transparent`;
                btn.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-book-primary text-white flex items-center justify-center font-bold text-base shadow-soft shrink-0">
                        ${item.lessonNum}
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-[11px] uppercase font-bold text-book-primary tracking-wider">Bài học ${item.lessonNum}</span>
                        <span class="font-heading text-sm font-bold truncate">${item.title.split(': ')[1]}</span>
                    </div>
                `;
                btn.onclick = () => loadContent(index);
                btn.dataset.index = index;
                tocContainer.appendChild(btn);
            });
        }

        function loadContent(index) {
            currentIndex = index;
            const data = bookData[index];
            
            contentDisplay.classList.remove('content-fade-in');
            
            setTimeout(() => {
                contentDisplay.innerHTML = data.content;
                contentDisplay.classList.add('content-fade-in');
                document.getElementById('main-scroll').scrollTop = 0;
            }, 10);

            // Update active styling
            document.querySelectorAll('.nav-item').forEach(el => {
                if(parseInt(el.dataset.index) === index) {
                    el.classList.add('active');
                    el.classList.add('border-book-primary/30');
                } else {
                    el.classList.remove('active');
                    el.classList.remove('border-book-primary/30');
                }
            });

            // Update navigation buttons
            if (index === 0) {
                btnPrev.style.display = 'none';
                btnNext.style.display = 'block';
                btnNext.innerHTML = 'Bài 2 <i class="fas fa-arrow-right ml-2"></i>';
            } else {
                btnPrev.style.display = 'block';
                btnPrev.innerHTML = '<i class="fas fa-arrow-left mr-2"></i> Bài 1';
                btnNext.style.display = 'none';
            }

            if(window.innerWidth < 1024 && mobileMenuOpen) {
                toggleMobileMenu();
            }
        }

        btnPrev.onclick = () => {
            if (currentIndex > 0) loadContent(currentIndex - 1);
        };

        btnNext.onclick = () => {
            if (currentIndex < bookData.length - 1) loadContent(currentIndex + 1);
        };

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            if (mobileMenuOpen) {
                sidebar.classList.remove('-translate-x-full');
                mobileMenuBtn.innerHTML = '<i class="fas fa-times text-xl"></i>';
            } else {
                sidebar.classList.add('-translate-x-full');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars text-xl"></i>';
            }
        }

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        // Initialize
        buildNavigation();
        loadContent(0);

    </script>
</body>
</html>
